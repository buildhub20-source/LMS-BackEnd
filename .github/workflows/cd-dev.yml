name: CD (development)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: cd-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Build image and deploy to development
    runs-on: ubuntu-latest
    environment: development

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B -ntp verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Registries reject upper-case names, and github.repository keeps the
      # owner/repo casing (LMS-BackEnd), so lower-case it once here.
      - name: Image name
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:dev
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DEV_DEPLOY_WEBHOOK }}
          IMAGE: ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
        run: |
          echo "Deploying $IMAGE to the development environment"
          # Replace with the actual deployment call for your platform,
          # for example: kubectl set image / az webapp / aws ecs update-service.
          test -n "$DEPLOY_WEBHOOK" && curl -fsSL -X POST "$DEPLOY_WEBHOOK" -d "image=$IMAGE" || echo "No webhook configured"
