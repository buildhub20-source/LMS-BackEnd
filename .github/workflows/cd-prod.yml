name: CD (production)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release candidate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run the full test suite
        run: mvn -B -ntp verify

  publish:
    name: Build and publish the release image
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: meta
        run: echo "image=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: publish
    runs-on: ubuntu-latest
    # Requires a manual approval configured on the production environment.
    environment: production

    steps:
      - name: Deploy the published image
        env:
          DEPLOY_WEBHOOK: ${{ secrets.PROD_DEPLOY_WEBHOOK }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          echo "Deploying $IMAGE to production"
          # Flyway migrations run on application start-up.
          # Replace with the actual deployment call for your platform.
          test -n "$DEPLOY_WEBHOOK" && curl -fsSL -X POST "$DEPLOY_WEBHOOK" -d "image=$IMAGE" || echo "No webhook configured"

      - name: Smoke test
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: |
          test -n "$BASE_URL" || { echo "PROD_BASE_URL not configured, skipping"; exit 0; }
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$BASE_URL/actuator/health" | grep -q UP; then
              echo "Health check passed"; exit 0
            fi
            echo "Waiting for the service to become healthy ($attempt/6)"; sleep 15
          done
          echo "Service did not become healthy"; exit 1
