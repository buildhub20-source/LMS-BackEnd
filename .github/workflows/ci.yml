name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile
        run: mvn -B -ntp clean compile

      - name: Run tests
        run: mvn -B -ntp verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Package
        run: mvn -B -ntp package -DskipTests

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: lms-backend-jar
          path: target/*.jar

  quality:
    name: Dependency and code checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check for dependency updates
        run: mvn -B -ntp versions:display-dependency-updates || true

      - name: Verify the build is reproducible without tests
        run: mvn -B -ntp -DskipTests package
