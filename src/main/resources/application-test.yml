spring:
  datasource:
    url: jdbc:h2:mem:lms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        # H2 has no `lms` schema; the suite never touches the cloud database.
        default_schema: public
  flyway:
    enabled: false
    schemas: public
    default-schema: public

lms:
  security:
    jwt:
      secret: test-secret-key-used-only-by-the-test-suite-0123456789
      access-token-ttl: 5m
      refresh-token-ttl: 1h

logging:
  level:
    com.lms: WARN
