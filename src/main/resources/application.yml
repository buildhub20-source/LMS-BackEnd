spring:
  # Reads a local .env as a property source when present. Optional, so nothing
  # breaks in CI or in a container where the values arrive as real env vars.
  # Note: parsed as .properties, so a backslash in a value is an escape.
  config:
    import: optional:file:.env[.properties]
  application:
    name: lms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    # No defaults on purpose. The database is a managed cloud instance in every
    # environment, so a missing value must fail at startup rather than fall back
    # to a local server that happens to be running.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: lms-pool
      # Managed Postgres caps connections per project and the cap is shared by
      # everyone pointed at it. Stay small.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      # A cloud round trip is slower than a loopback one; do not hold idle
      # connections open longer than the provider will.
      idle-timeout: 300000
      max-lifetime: 900000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:lms}
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Dedicated schema, never `public`: Supabase publishes public through its
    # REST API. See docs/database/supabase.md.
    schemas: ${DB_SCHEMA:lms}
    default-schema: ${DB_SCHEMA:lms}
    create-schemas: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

lms:
  app:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      name: ${BOOTSTRAP_ADMIN_NAME:Platform Administrator}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail:
    # When false the invitation and reset messages are written to the log
    # instead of being sent, which is what dev and test rely on.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@lms.local}
    from-name: ${MAIL_FROM_NAME:LMS}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:lms-backend}
      # Access tokens are short-lived because they are not revocable; the
      # refresh session in the database is the revocation point.
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
      clock-skew: 30s
    policy:
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
      failed-attempt-window: ${LOGIN_FAILED_WINDOW:15m}
      invitation-ttl: ${INVITATION_TTL:7d}
      password-reset-ttl: ${PASSWORD_RESET_TTL:30m}
      max-sessions-per-user: ${MAX_SESSIONS_PER_USER:10}

logging:
  level:
    com.lms: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: WARN
