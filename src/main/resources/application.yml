spring:
  # Reads a local .env as a property source when present. Optional, so nothing
  # breaks in CI or in a container where the values arrive as real env vars.
  # Note: parsed as .properties, so a backslash in a value is an escape.
  config:
    import: optional:file:.env[.properties]
  application:
    name: lms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  # Redis is optional and only used when REDIS_ENABLED=true (see lms.redis).
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      # Short on purpose: sign-in waits on the rate-limit check, so a Redis
      # outage must fail fast and fall back (FailoverRateLimitStore) rather than
      # hold every login for the client's 60 s default.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      repositories:
        enabled: false
  datasource:
    # No defaults on purpose. The database is a managed cloud instance in every
    # environment, so a missing value must fail at startup rather than fall back
    # to a local server that happens to be running.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: lms-pool
      # Managed Postgres caps connections per project and the cap is shared by
      # everyone pointed at it. Stay small.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      # A cloud round trip is slower than a loopback one; do not hold idle
      # connections open longer than the provider will.
      idle-timeout: 300000
      max-lifetime: 900000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:lms}
        # Load lazy collections (course modules, lessons, roles…) for a whole
        # page in one query instead of one per row; each query is a cloud round trip.
        default_batch_fetch_size: 64
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Dedicated schema, never `public`: Supabase publishes public through its
    # REST API. See docs/database/supabase.md.
    schemas: ${DB_SCHEMA:lms}
    default-schema: ${DB_SCHEMA:lms}
    create-schemas: true
    # Migration naming convention:
    #   Legacy (V1–V23):  V<n>__description.sql  – DO NOT add new files in this series.
    #   Current standard: V<YYYYMMDD>_<sequence>__description.sql
    #     e.g. V20260917_1000__add_feature.sql
    #   All new migrations MUST use the date-prefixed format. Flyway orders by
    #   the full version string, so date-prefixed versions sort after all legacy ones.

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  # Redis and mail stay out of /actuator/health. The backend keeps serving
  # without either (limits and job locks fall back to this process; mails are
  # sent in the background and failures are logged), so reporting DOWN would
  # only make the load balancer pull every copy at once. Outages show in the logs.
  health:
    redis:
      enabled: false
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

lms:
  # Shared state for running more than one backend copy: sign-in and code-run
  # rate limits are counted in Redis, and scheduled jobs take a Redis lock so
  # only one copy runs each sweep. Off = in-process (single copy only).
  redis:
    enabled: ${REDIS_ENABLED:false}
    key-prefix: ${REDIS_KEY_PREFIX:lms:}
  app:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    # Mail sent for an institute links to <slug>.<this domain>; blank keeps
    # every link on frontend-base-url (local development).
    tenant-base-domain: ${TENANT_BASE_DOMAIN:}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      name: ${BOOTSTRAP_ADMIN_NAME:Platform Administrator}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail:
    # When false the invitation and reset messages are written to the log
    # instead of being sent, which is what dev and test rely on.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@lms.local}
    from-name: ${MAIL_FROM_NAME:GradusMind}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:lms-backend}
      # Access tokens are short-lived because they are not revocable; the
      # refresh session in the database is the revocation point.
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
      clock-skew: 30s
    policy:
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
      failed-attempt-window: ${LOGIN_FAILED_WINDOW:15m}
      invitation-ttl: ${INVITATION_TTL:7d}
      password-reset-ttl: ${PASSWORD_RESET_TTL:30m}
      max-sessions-per-user: ${MAX_SESSIONS_PER_USER:10}

  storage:
    provider: ${STORAGE_PROVIDER:CLOUDFLARE_R2}
    r2:
      endpoint: ${R2_ENDPOINT:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
      bucket: ${R2_BUCKET:}
      public-url: ${R2_PUBLIC_URL:}

  # Internal service-to-service API
  internal:
    service-key: ${SERVICE_KEY_SECRET:change-me-in-production}

  # Certificate microservice integration
  certificate-service:
    base-url: ${CERT_SERVICE_URL:http://localhost:8081}
    enabled: ${CERT_SERVICE_ENABLED:false}
    timeout-ms: ${CERT_SERVICE_TIMEOUT_MS:3000}

  # LMS-Notification-Service. The row is written here either way; this only
  # controls whether the recipient's bell updates without a refetch.
  notification-service:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:3002}
    enabled: ${NOTIFICATION_SERVICE_ENABLED:false}
    timeout-ms: ${NOTIFICATION_SERVICE_TIMEOUT_MS:2000}

  # Mails sent to students when they are given something to learn from.
  # lms.mail.enabled still decides whether any mail leaves at all; these only
  # choose which events are worth one. The assessment and toolkit mails reach
  # every active student, so each can be silenced on its own.
  learning-mail:
    enrollment-enabled: ${LEARNING_MAIL_ENROLLMENT:true}
    assessment-enabled: ${LEARNING_MAIL_ASSESSMENT:true}
    live-session-enabled: ${LEARNING_MAIL_LIVE_SESSION:true}
    live-reminder-enabled: ${LEARNING_MAIL_LIVE_REMINDER:true}
    campus-toolkit-enabled: ${LEARNING_MAIL_CAMPUS_TOOLKIT:true}
    signature: ${LEARNING_MAIL_SIGNATURE:The GradusMind team}
    # Sessions are stored as instants, so without a zone every student would
    # be told a UTC time.
    time-zone: ${LEARNING_MAIL_TIME_ZONE:Asia/Kolkata}
    time-zone-label: ${LEARNING_MAIL_TIME_ZONE_LABEL:IST}

  # LMS-AI-Service (Claude-powered grading). Off until the service is deployed.
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:3003}
    enabled: ${AI_SERVICE_ENABLED:false}
    # Grading runs the student's code against every test case; allow for it.
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:180000}

  # Judge0-compatible sandbox for running Java, Python, C and C++ answers.
  # Leave CODE_RUNNER_URL blank to keep server-side runs off (see docs/code-runner.md).
  code-runner:
    base-url: ${CODE_RUNNER_URL:}
    api-key: ${CODE_RUNNER_API_KEY:}
    runs-per-minute: ${CODE_RUNNER_RUNS_PER_MINUTE:30}

  livekit:
    url: ${LIVEKIT_URL:wss://livekit.cloud.local}
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:secret12345678901234567890123456789012}
    token-ttl-minutes: ${LIVEKIT_TOKEN_TTL_MINUTES:120}

  # Global control plane. Tenant data is held in a separate cloud database;
  # this database contains only the tenant registry and global administrators.
  platform:
    enabled: ${PLATFORM_ENABLED:false}
    tenant-resolution-required: ${TENANT_RESOLUTION_REQUIRED:false}
    tenant-header: ${TENANT_HEADER:X-Tenant-Slug}
    base-domain: ${TENANT_BASE_DOMAIN:}
    credential-encryption-key: ${TENANT_CREDENTIAL_ENCRYPTION_KEY:}
    google-calendar:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}
      frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    global-admin:
      enabled: ${PLATFORM_ADMIN_ENABLED:false}
      email: ${PLATFORM_ADMIN_EMAIL:}
      password: ${PLATFORM_ADMIN_PASSWORD:}
      name: ${PLATFORM_ADMIN_NAME:Platform Administrator}
    provisioning:
      provider: ${TENANT_PROVISIONING_PROVIDER:SUPABASE}
      supabase:
        access-token: ${SUPABASE_ACCESS_TOKEN:}
        organization-slug: ${SUPABASE_ORGANIZATION_SLUG:}
        region: ${SUPABASE_TENANT_REGION:ap-southeast-1}
        instance-size: ${SUPABASE_TENANT_INSTANCE_SIZE:}

logging:
  level:
    com.lms: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: WARN
